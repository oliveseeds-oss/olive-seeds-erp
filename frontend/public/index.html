<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    // Prevent chrome extension exceptions from popping up on React Developer overlay
    window.addEventListener('error', function(e) {
      var isExt = (e.message && e.message.indexOf('M_ID') !== -1) || 
                  (e.filename && e.filename.indexOf('chrome-extension') !== -1) ||
                  (e.error && e.error.stack && e.error.stack.indexOf('chrome-extension') !== -1);
      if (isExt) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }, true);
    window.addEventListener('unhandledrejection', function(e) {
      var reason = e.reason && (e.reason.message || e.reason.stack || '');
      if (reason && (reason.indexOf('M_ID') !== -1 || reason.indexOf('chrome-extension') !== -1)) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }, true);
  </script>
  <meta name="theme-color" content="#1a5276" />
  <title>Olive Seeds ERP</title>
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
